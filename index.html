<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio szkolne Yevheniia — projekty, strony i zadania programistyczne.">
    <meta name="theme-color" content="#0b0f19">
    <title>Moje projekty — Yevhenii</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#projects">Przejdź do projektów</a>
    <header class="site-header">
        <div class="header-content">
            <p class="eyebrow">Moje portfolio</p>
            <h1>Projekty i zadania</h1>
            <p class="intro">Przegląd moich prac — wybierz projekt, aby zobaczyć jego działanie.</p>
        </div>
    </header>
    <main>
        <section class="projects-section" aria-labelledby="projects-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Zebrane w jednym miejscu</p>
                    <h2 id="projects-heading">Moje projekty</h2>
                </div>
                <p class="section-note">Podgląd, użyte technologie i plik bazy danych.</p>
            </div>
            <div id="projects" class="projects-grid" tabindex="-1" aria-live="polite" aria-busy="false"></div>
            <noscript><p class="status status-error">Aby wyświetlić projekty, włącz obsługę JavaScript.</p></noscript>
        </section>
    </main>
    <footer class="site-footer">
        <p>Stronę wykonał: Yelisieiev Yevhenii</p>
    </footer>
</body>
</html>
