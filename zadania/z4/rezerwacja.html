<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biuro turystyczne</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h1>Rezerwacja wycieczek</h1>
    </header>
    <main>
        <nav>
            <button id="uczestnik" onClick="uczestnikF()">Uczestnik</button>
            <button id="rezerwacja" onClick="rezerwacjaF()">Rezerwacja</button>
        </nav>
        <section id="section1">
            <h2>Dane Klienta</h2>
            <img src="osoba.png" alt="Klient"><br>
            <label for="imie">Imie</label>
            <input type="text" id="imie"><br>
            <label for="nazwisko">Nazwisko</label>
            <input type="text" id="nazwisko">
            <p><a href="wycieczki.html">Do strony glownej</a></p>
        </section>
        <section id="section2">
            <h2>Dane rezerwacji</h2>
            <span onClick="turnLeft()">&laquo;</span>
            <img src="1.jpg" alt="wycieczka" id="img">
            <span onClick="turnRight()">&raquo;</span>
            <h4 id="place">Barcelona</h4>
            <label for="sumP">Liczba osob:</label>
            <input type="number" id="sumP" min="1" max="4" value="2" disabled><br>
            <label for="placeP">Miejsce wylotu:</label>
            <select id="placeP" disabled>
                <option>Warszawa</option>
                <option>Kraków</option>
                <option>Wrocław</option>
            </select><br>
            <input type="radio" name="food" id="r1" checked disabled>
            <label for="r1">Śniadania</label>
            <input type="radio" name="food" id="r2" disabled>
            <label for="r2">Śniadania i obiadokolacje</label>
            <input type="radio" name="food" id="r3" disabled>
            <label for="r3">All inclusive</label><br>
            <button>Sprawdź cenę</button>
        </section>
        <aside>
            <img src="1.jpg" alt="wycieczki">
            <img src="2.jpg" alt="wycieczki">
            <img src="3.jpg" alt="wycieczki">
            <img src="1.jpg" alt="wycieczki">
            <img src="2.jpg" alt="wycieczki">
            <img src="3.jpg" alt="wycieczki">
            <img src="1.jpg" alt="wycieczki">
            <img src="2.jpg" alt="wycieczki">
            <img src="3.jpg" alt="wycieczki">
        </aside>
    </main>
    <footer>
        <p>Autor strony: <em>Yelisieiev Yevhenii</em></p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
